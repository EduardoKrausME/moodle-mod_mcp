:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#26314d;background:#fff4f4;--accent:#a9585d;--soft:#fff4f4;--line:#dfe3ee}*{box-sizing:border-box}body{margin:0;padding:40px 42px 54px;min-height:100vh;line-height:1.55}main{width:min(850px,100%);margin:0 auto}h1{font-size:clamp(28px,3.8vw,42px);letter-spacing:-1.2px;line-height:1.15;margin:8px 0 14px}h2{font-size:21px;margin:0 0 12px}p{margin:7px 0 16px}header p{color:#69758f;max-width:670px;font-size:15px}.kicker{font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent)}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:26px;box-shadow:0 10px 28px #152a5b0c;margin-top:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--line);padding:15px 16px;border-radius:12px;color:#33405c;font-weight:600;cursor:pointer;transition:background .16s,border .16s}.choice:hover,.choice:focus-visible{border-color:var(--accent);background:var(--soft)}.choice[aria-pressed=true],.choice.selected{background:var(--soft);border-color:var(--accent);color:var(--accent)}.choice:disabled{opacity:.68;cursor:not-allowed}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:white;border:1px solid var(--accent);padding:12px 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(.93)}.btn.secondary{background:white;color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.muted{color:#6a758c;font-size:13px}.feedback{padding:14px;border-radius:11px;background:#edf8f3;border:1px solid #c7e9d8;color:#265d49;margin-top:17px}.feedback.warn{background:#fff6e9;border-color:#f0dab5;color:#795021}.progress{height:9px;background:#e8eaf3;border-radius:9px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}.small-label{font-size:12px;font-weight:760;color:var(--accent)}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:11px}.item h3{font-size:17px;margin:0 0 8px}.item p{margin:0;color:#59657a}.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.steps button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;color:#56627d;cursor:pointer}.steps button[aria-current=true]{background:var(--accent);color:#fff;border-color:var(--accent)}input,select,textarea{border:1px solid #cfd6e4;border-radius:10px;padding:13px;width:100%;font:inherit;background:#fff;color:#26314d}label{display:block;margin:10px 0}.result{font-size:25px;font-weight:850;color:var(--accent)}.flip{min-height:125px}.flip strong{display:block;color:var(--accent);margin-bottom:11px}.chip{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:750;margin:3px 3px 12px 0}details{border:1px solid var(--line);background:white;padding:16px 20px;border-radius:12px;margin:10px 0}summary{cursor:pointer;font-weight:750}details p{color:#59657a;margin:12px 0 3px}.tick{display:flex;align-items:center;gap:11px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:9px 0}.tick input{width:20px;height:20px}.list-ordered{display:grid;gap:10px}.list-ordered>div{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.move{margin-left:auto;white-space:nowrap}.move button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer}.timeline-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:11px;cursor:pointer}.timeline-item[aria-current=true]{border-color:var(--accent);background:var(--sof </style></head><body><main><header><span class="kicker">PESQUISA · Seleção múltipla</span><h1>Preferências de formato</h1><p>Aluno escolhe vários recursos e confirma a seleção.</p></header><div id="app"></div></main><script>(function surveyRender(c){
 const root=document.querySelector("#app"),qs=c.questions;let index=0,answers=[];const esc=s=>{const x=document.createElement("div");x.textContent=String(s);return x.innerHTML;};
 function render(){
  if(index===qs.length){root.innerHTML=`<section class="panel"><span class="small-label">PESQUISA CONCLUÍDA</span><h2>Obrigado pela participação!</h2><p>Você respondeu ${answers.length} pergunta(s). Esta demonstração não envia dados ao Moodle nem identifica participantes.</p><button class="btn" id="again">Responder novamente</button></section>`;root.querySelector("#again").onclick=()=>{index=0;answers=[];render();};return;}
  const q=qs[index];let form="";
  if(q.type==="text")form=`<label for="response">Sua opinião</label><textarea id="response" rows="4" maxlength="400" placeholder="Escreva sua resposta aqui..."></textarea><button class="btn" id="confirm">Continuar</button>`;
  else if(q.type==="multi")form=`<div class="grid">${q.options.map((o,n)=>`<label class="choice"><input type="checkbox" value="${n}" style="width:17px;margin-right:8px">${esc(o)}</label>`).join("")}</div><button class="btn" id="confirm">Confirmar seleção</button>`;
  else form=`<div class="grid">${q.options.map((o,n)=>`<button type="button" class="choice option" data-i="${n}">${esc(o)}</button>`).join("")}</div>`;
  root.innerHTML=`<section class="panel"><span class="small-label">Pergunta ${index+1} de ${qs.length}</span><div class="progress"><span style="width:${index/qs.length*100}%"></span></div><h2>${esc(q.question)}</h2><p class="muted">${q.hint?esc(q.hint):"Escolha a resposta que melhor representa sua experiência."}</p><div id="survey-step">${form}</div><p id="error" role="status" class="muted"></p></section>`;
  const save=(value)=>{answers.push({question:q.question,response:value});const step=root.querySelector("#survey-step");step.style.opacity="0.2";step.style.transform="translateX(-12px)";step.style.transition="opacity .18s,transform .18s";setTimeout(()=>{index++;render();},matchMedia("(prefers-reduced-motion: reduce)").matches?0:190);};
  root.querySelectorAll(".option").forEach(b=>b.onclick=()=>save(q.options[+b.dataset.i]));
  const confirm=root.querySelector("#confirm");if(confirm)confirm.onclick=()=>{let value;if(q.type==="text")value=root.querySelector("#response").value.trim();else value=[...root.querySelectorAll("input:checked")].map(x=>q.options[+x.value]);if(!value||!value.length){root.querySelector("#error").textContent="Responda antes de continuar.";return;}save(value);};
 }render();
})({"slug":"preferencias-de-formato","title":"Preferências de formato","subtitle":"Aluno escolhe vários recursos e confirma a seleção.","description":"Aluno escolhe vários recursos e confirma a seleção.","how":"Apresenta uma pergunta por vez; respostas de seleção simples avançam automaticamente, enquanto texto e seleção múltipla exigem confirmação.","features":["Seleção múltipla","Uma pergunta por tela"],"kicker":"PESQUISA · Seleção múltipla","questions":[{"question":"Quais recursos ajudaram mais?","options":["Vídeos","Textos","Exercícios","Discussões"],"type":"multi"},{"question":"Qual formato gostaria de ver com mais frequência?","options":["Vídeos","Textos","Exercícios","Discussões"],"type":"multi"}],"color":"#a9585d","bg":"#fff4f4"});</script></body></html>
