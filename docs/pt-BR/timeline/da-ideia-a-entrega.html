</style></head><body><main><header><span class="kicker">LINHA DO TEMPO · Etapas de um projeto</span><h1>Da ideia à entrega</h1><p>Acompanhe um ciclo de projeto por fases.</p></header><div id="app"></div></main><script>(function timelineRender(c){
 const root=document.querySelector("#app");let index=0;const esc=s=>{const x=document.createElement("div");x.textContent=String(s);return x.innerHTML;};
 function render(){let event=c.events[index];root.innerHTML=`<section class="panel"><div class="small-label">${index+1} DE ${c.events.length} MARCOS</div><div class="progress"><span style="width:${(index+1)/c.events.length*100}%"></span></div><div class="timeline-list">${c.events.map((it,n)=>`<button class="timeline-item" data-n="${n}" aria-current="${n===index}"><b>${esc(it.when)}</b><span>${esc(it.title)}</span></button>`).join("")}</div><div class="timeline-detail"><span class="chip">${esc(event.when)}</span><h2>${esc(event.title)}</h2><p>${esc(event.text)}</p></div><div class="actions"><button class="btn secondary" id="prev" ${index===0?"disabled":""}>Anterior</button><button class="btn" id="next" ${index===c.events.length-1?"disabled":""}>Próximo marco</button></div></section>`;root.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{index=+b.dataset.n;render();});root.querySelector("#prev").onclick=()=>{index--;render();};root.querySelector("#next").onclick=()=>{index++;render();};}render();
