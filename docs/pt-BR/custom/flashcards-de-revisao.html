<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flashcards de revisão</title><style>
:root{font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26334e;background:#f5f2ff;--accent:#7254c9}*{box-sizing:border-box}body{margin:0;padding:42px 35px}main{max-width:850px;margin:auto}.eyebrow{letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:39px;line-height:1.15;letter-spacing:-1px;margin:7px 0 14px}h2{font-size:22px;margin:9px 0 16px}p{color:#65728b;margin:10px 0 17px}header p{max-width:650px;font-size:15px}.panel{margin-top:25px;padding:28px;background:#fff;border:1px solid #e1e3f0;border-radius:18px;box-shadow:0 10px 26px #28324c0c}.label{display:inline-block;color:var(--accent);font-size:11px;font-weight:800;background:#f4f1ff;border-radius:6px;padding:7px 10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:19px 0}.choice{font:inherit;font-weight:660;text-align:left;border:1px solid #d9dcea;background:#fff;border-radius:12px;padding:17px;min-height:72px;cursor:pointer;color:#364361}.choice:hover,.choice[aria-pressed=true]{border-color:var(--accent);background:#f4f1ff}.btn{border:1px solid var(--accent);background:var(--accent);color:white;font:inherit;font-weight:750;font-size:13px;border-radius:10px;padding:12px 17px;cursor:pointer}.btn.light{color:var(--accent);background:#fff}.callout{background:#f2efff;border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:16px;margin:20px 0;color:#435273}.row{padding:15px 0;border-bottom:1px solid #eceef5}.range-title{display:flex;justify-content:space-between;gap:10px;color:#45526c;font-weight:700}.range-title output{color:var(--accent)}input[type=range]{display:block;width:100%;margin:15px 0;accent-color:var(--accent)}.metric{background:#f4f2ff;padding:22px;border-radius:13px;margin-top:22px}.metric strong{display:block;font-size:32px;color:var(--accent)}.meter{height:9px;background:#e3e1f2;border-radius:5px;overflow:hidden;margin:12px 0}.meter span{height:100%;display:block;background:var(--accent)}.branch{display:block;width:100%;text-align:left;margin:9px 0;padding:17px;border:1px solid #e1e3ee;background:#fff;border-radius:12px;cursor:pointer}.branch[aria-expanded=true]{border-color:var(--accent);background:#f4f1ff}.branch strong,.branch span{display:block}.branch span{font-size:13px;color:#68738a;margin-top:7px}.flash{background:var(--accent);border:0;border-radius:17px;min-height:230px;width:100%;color:white;font:inherit;font-size:24px;font-weight:750;padding:30px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.small{font-size:12px;color:#778198}button:focus-visible,input:focus-visible{outline:3px solid #9b8ff2;outline-offset:3px}@media(max-width:630px){body{padding:25px 17px}h1{font-size:30px}.panel{padding:19px}.choices{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><span class="eyebrow">EU ESCOLHO · FLASHCARDS</span><h1>Flashcards de revisão</h1><p>Revele definições de conceitos pedagógicos.</p></header><div id="app"></div></main><script>(function customRender(c){
const r=document.querySelector("#app");let i=0,revealed=false,chosen=-1,open=[];
const esc=x=>{const n=document.createElement("div");n.textContent=x;return n.innerHTML;};
function render(){
if(c.mode==="flash"){const x=c.items[i];r.innerHTML=`<section class="panel"><span class="label">CARTÃO ${i+1} DE ${c.items.length}</span><p>Toque no cartão para revelar a resposta.</p><button class="flash" id="reveal">${esc(revealed?x[1]:x[0])}</button><div class="actions"><button id="prev" class="btn light" ${i===0?"disabled":""}>Anterior</button><button id="next" class="btn">${i===c.items.length-1?"Recomeçar":"Próximo"}</button></div></section>`;r.querySelector("#reveal").onclick=()=>{revealed=!revealed;render();};r.querySelector("#prev").onclick=()=>{i--;revealed=false;render();};r.querySelector("#next").onclick=()=>{i=(i+1)%c.items.length;revealed=false;render();};return;}
if(c.mode==="map"){r.innerHTML=`<section class="panel"><span class="label">MAPA MENTAL</span><h2>Explore os ramos de ${esc(c.topic)}</h2>${c.items.map((x,n)=>`<button class="branch" data-i="${n}" aria-expanded="${open.includes(n)}"><strong>${esc(x[0])}</strong><span>${open.includes(n)?esc(x[1]):"Clique para expandir"}</span></button>`).join("")}</section>`;r.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const k=+b.dataset.i;open=open.includes(k)?open.filter(n=>n!==k):[...open,k];render();});return;}
if(chosen>=0&&c.mode==="route"){const x=c.items[chosen];r.innerHTML=`<section class="panel"><span class="label">TRILHA SUGERIDA</span><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p><button class="btn" id="again">Escolher novamente</button></section>`;r.querySelector("#again").onclick=()=>{chosen=-1;render();};return;}
r.innerHTML=`<section class="panel"><span class="label">${esc(c.mode==="vote"?"ENQUETE LOCAL":c.mode==="compare"?"COMPARADOR":"ESCOLHA SUA TRILHA")}</span><h2>${esc(c.question)}</h2><div class="choices">${c.items.map((x,n)=>`<button class="choice" data-i="${n}" aria-pressed="${chosen===n}">${esc(x[0])}</button>`).join("")}</div>${chosen>=0?`<div class="callout">${esc(c.items[chosen][1])}</div>`:""}<p class="small">Esta interação é demonstrativa e não envia dados ao Moodle.</p></section>`;r.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;render();});
}render();
})({"title":"Flashcards de revisão","subtitle":"Revele definições de conceitos pedagógicos.","kicker":"EU ESCOLHO · FLASHCARDS","color":"#7254c9","bg":"#f5f2ff","mode":"flash","question":"","topic":"","items":[["Objetivo de aprendizagem","Resultado observável que orienta prática e avaliação."],["Feedback formativo","Orientação que ajuda o estudante durante o processo."],["Rubrica","Critérios explícitos para orientar e avaliar uma produção."],["Aprendizagem ativa","Participação do estudante na construção do conhecimento."]]});</script></body></html>
