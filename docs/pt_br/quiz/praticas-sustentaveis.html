<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Práticas sustentáveis</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#26314d;background:#f6f2ff;--accent:#6f5ad1;--soft:#f6f2ff;--line:#dfe3ee}*{box-sizing:border-box}body{margin:0;padding:40px 42px 54px;min-height:100vh;line-height:1.55}main{width:min(850px,100%);margin:0 auto}h1{font-size:clamp(28px,3.8vw,42px);letter-spacing:-1.2px;line-height:1.15;margin:8px 0 14px}h2{font-size:21px;margin:0 0 12px}p{margin:7px 0 16px}header p{color:#69758f;max-width:670px;font-size:15px}.kicker{font-size:11px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent)}.panel{background:#fff;border:1px solid var(--line);border-radius:19px;padding:26px;box-shadow:0 10px 28px #152a5b0c;margin-top:28px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--line);padding:15px 16px;border-radius:12px;color:#33405c;font-weight:600;cursor:pointer;transition:background .16s,border .16s}.choice:hover,.choice:focus-visible{border-color:var(--accent);background:var(--soft)}.choice[aria-pressed=true],.choice.selected{background:var(--soft);border-color:var(--accent);color:var(--accent)}.choice:disabled{opacity:.68;cursor:not-allowed}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:white;border:1px solid var(--accent);padding:12px 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:750;cursor:pointer}.btn:hover{filter:brightness(.93)}.btn.secondary{background:white;color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.muted{color:#6a758c;font-size:13px}.feedback{padding:14px;border-radius:11px;background:#edf8f3;border:1px solid #c7e9d8;color:#265d49;margin-top:17px}.feedback.warn{background:#fff6e9;border-color:#f0dab5;color:#795021}.progress{height:9px;background:#e8eaf3;border-radius:9px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .2s}.small-label{font-size:12px;font-weight:760;color:var(--accent)}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:11px}.item h3{font-size:17px;margin:0 0 8px}.item p{margin:0;color:#59657a}.steps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.steps button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 13px;color:#56627d;cursor:pointer}.steps button[aria-current=true]{background:var(--accent);color:#fff;border-color:var(--accent)}input,select,textarea{border:1px solid #cfd6e4;border-radius:10px;padding:13px;width:100%;font:inherit;background:#fff;color:#26314d}label{display:block;margin:10px 0}.result{font-size:25px;font-weight:850;color:var(--accent)}.flip{min-height:125px}.flip strong{display:block;color:var(--accent);margin-bottom:11px}.chip{display:inline-block;padding:6px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:750;margin:3px 3px 12px 0}details{border:1px solid var(--line);background:white;padding:16px 20px;border-radius:12px;margin:10px 0}summary{cursor:pointer;font-weight:750}details p{color:#59657a;margin:12px 0 3px}.tick{display:flex;align-items:center;gap:11px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:9px 0}.tick input{width:20px;height:20px}.list-ordered{display:grid;gap:10px}.list-ordered>div{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.move{margin-left:auto;white-space:nowrap}.move button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 11px;cursor:pointer}.timeline-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:12px 16px;border-radius:11px;cursor:pointer}.timeline-item[aria-current=true]{border-color:var(--accent);background:var(--soft)}.timeline-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin:23px 0}.timeline-item b{display:block;color:var(--accent)}.timeline-item span{display:block;font-size:12px}.timeline-detail{min-height:150px}button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid #9d8cfd;outline-offset:2px}@media(max-width:640px){body{padding:24px 18px}.panel{padding:20px}.grid{grid-template-columns:1fr}h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><span class="kicker">QUIZ · Múltipla seleção</span><h1>Práticas sustentáveis</h1><p>Marque todas as alternativas corretas.</p></header><div id="app"></div></main><script>(function quizRender(c){
 const root=document.querySelector("#app"),qs=c.questions;let index=0,score=0,selected=[],order=[],timer=null,seconds=0,started=c.mode!=="timed";const esc=s=>{const x=document.createElement("div");x.textContent=String(s);return x.innerHTML;};
 function done(){if(timer)clearInterval(timer);root.innerHTML=`<section class="panel"><span class="small-label">DESAFIO FINALIZADO</span><h2>Você acertou ${score} de ${qs.length}</h2><div class="progress"><span style="width:${score/qs.length*100}%"></span></div><p>Esta é uma correção demonstrativa no navegador, sem nota ou registro no Moodle.</p><button class="btn" id="again">Refazer atividade</button></section>`;root.querySelector("#again").onclick=()=>{index=0;score=0;selected=[];started=c.mode!=="timed";render();};}
 function render(){
  if(index>=qs.length){done();return;}
  if(!started){root.innerHTML=`<section class="panel"><h2>Pronto para começar?</h2><p>Você terá ${c.time||45} segundos para responder às perguntas. A contagem começa quando clicar em iniciar.</p><button id="start" class="btn">Começar</button></section>`;root.querySelector("#start").onclick=()=>{started=true;seconds=c.time||45;timer=setInterval(()=>{seconds--;const t=root.querySelector("#remaining");if(t)t.textContent=seconds+" s restantes";if(seconds<=0){clearInterval(timer);timer=null;done();}},1000);render();};return;}
  const q=qs[index];selected=[];order=q.options?[...q.options]:[];
  let content="";
  if(c.mode==="order"){content=`<p class="muted">Coloque os itens na ordem adequada usando as setas.</p><div id="ordering" class="list-ordered"></div>`;}
  else if(c.mode==="fill"){content=`<label for="answer">Sua resposta</label><input id="answer" autocomplete="off" placeholder="Digite a resposta">`;}
  else if(c.mode==="match"){content=`<label for="answer">Selecione o conceito correspondente</label><select id="answer"><option value="">Escolha a resposta</option>${q.options.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;}
  else {content=`<div class="${c.mode==="multi"?"":"grid"}">${q.options.map((o,n)=>`<label class="choice"><input type="${c.mode==="multi"?"checkbox":"radio"}" name="answer" value="${n}" style="width:18px;margin-right:9px">${esc(o)}</label>`).join("")}</div>`;}
  root.innerHTML=`<section class="panel"><div class="small-label">Questão ${index+1} de ${qs.length}${c.mode==="timed"?` · <span id="remaining">${seconds} s restantes</span>`:""}</div><div class="progress"><span style="width:${index/qs.length*100}%"></span></div><h2>${esc(q.question)}</h2>${content}<div class="actions"><button class="btn" id="check">Verificar resposta</button><button class="btn secondary" id="next" hidden>Próxima questão</button></div><div id="feedback" role="status" aria-live="polite"></div></section>`;
  if(c.mode==="order")drawOrder();
  root.querySelector("#check").onclick=check;
  root.querySelector("#next").onclick=()=>{index++;render();};
 }
 function drawOrder(){const region=root.querySelector("#ordering");region.innerHTML=order.map((v,n)=>`<div><b>${n+1}.</b><span>${esc(v)}</span><span class="move"><button data-i="${n}" data-m="-1" aria-label="Mover para cima" ${n===0?"disabled":""}>↑</button> <button data-i="${n}" data-m="1" aria-label="Mover para baixo" ${n===order.length-1?"disabled":""}>↓</button></span></div>`).join("");region.querySelectorAll("button:not(:disabled)").forEach(b=>b.onclick=()=>{const n=+b.dataset.i,j=n+(+b.dataset.m);[order[n],order[j]]=[order[j],order[n]];drawOrder();});}
 function check(){const q=qs[index];let value,correct=false;if(c.mode==="order"){value=order;correct=JSON.stringify(order)===JSON.stringify(q.correct);}
 else if(c.mode==="fill"||c.mode==="match"){value=root.querySelector("#answer").value.trim();if(!value){root.querySelector("#feedback").textContent="Preencha a resposta antes de conferir.";return;}correct=value.toLocaleLowerCase("pt-BR")===String(q.correct).toLocaleLowerCase("pt-BR");}
 else {const checked=[...root.querySelectorAll("input:checked")].map(x=>+x.value);if(!checked.length){root.querySelector("#feedback").textContent="Selecione uma alternativa.";return;}correct=c.mode==="multi"?JSON.stringify(checked)===JSON.stringify(q.correct):checked[0]===q.correct;}
 if(correct)score++;
 root.querySelector("#feedback").className="feedback"+(correct?"":" warn");root.querySelector("#feedback").textContent=(correct?"Correto! ":"Vamos revisar. ")+(q.explanation||"");root.querySelector("#check").hidden=true;root.querySelector("#next").hidden=false;root.querySelectorAll("input,select,#ordering button").forEach(x=>x.disabled=true);root.querySelector("#next").textContent=index===qs.length-1?"Ver resultado":"Próxima questão";
 }render();
})({"slug":"praticas-sustentaveis","title":"Práticas sustentáveis","subtitle":"Marque todas as alternativas corretas.","description":"Marque todas as alternativas corretas.","how":"O aluno responde, recebe feedback e avança até ver a pontuação demonstrativa.","features":["Múltipla seleção","Feedback imediato"],"kicker":"QUIZ · Múltipla seleção","mode":"multi","questions":[{"question":"Quais hábitos ajudam a reduzir desperdício de água?","options":["Consertar vazamentos","Deixar torneira aberta","Reutilizar água quando seguro"],"correct":[0,2],"explanation":"Reparar vazamentos e reutilizar água de forma adequada reduz perdas."},{"question":"Quais materiais costumam ser recicláveis quando limpos?","options":["Papel","Garrafa de vidro","Guardanapo engordurado"],"correct":[0,1],"explanation":"Papel e vidro são geralmente aceitos, mas regras locais de coleta variam."}],"color":"#6f5ad1","bg":"#f6f2ff","time":45});</script></body></html>
