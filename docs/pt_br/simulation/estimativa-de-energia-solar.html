<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estimativa de energia solar</title><style>
:root{font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26334e;background:#fff7ec;--accent:#bc783b}*{box-sizing:border-box}body{margin:0;padding:42px 35px}main{max-width:850px;margin:auto}.eyebrow{letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:39px;line-height:1.15;letter-spacing:-1px;margin:7px 0 14px}h2{font-size:22px;margin:9px 0 16px}p{color:#65728b;margin:10px 0 17px}header p{max-width:650px;font-size:15px}.panel{margin-top:25px;padding:28px;background:#fff;border:1px solid #e1e3f0;border-radius:18px;box-shadow:0 10px 26px #28324c0c}.label{display:inline-block;color:var(--accent);font-size:11px;font-weight:800;background:#f4f1ff;border-radius:6px;padding:7px 10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:19px 0}.choice{font:inherit;font-weight:660;text-align:left;border:1px solid #d9dcea;background:#fff;border-radius:12px;padding:17px;min-height:72px;cursor:pointer;color:#364361}.choice:hover,.choice[aria-pressed=true]{border-color:var(--accent);background:#f4f1ff}.btn{border:1px solid var(--accent);background:var(--accent);color:white;font:inherit;font-weight:750;font-size:13px;border-radius:10px;padding:12px 17px;cursor:pointer}.btn.light{color:var(--accent);background:#fff}.callout{background:#f2efff;border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:16px;margin:20px 0;color:#435273}.row{padding:15px 0;border-bottom:1px solid #eceef5}.range-title{display:flex;justify-content:space-between;gap:10px;color:#45526c;font-weight:700}.range-title output{color:var(--accent)}input[type=range]{display:block;width:100%;margin:15px 0;accent-color:var(--accent)}.metric{background:#f4f2ff;padding:22px;border-radius:13px;margin-top:22px}.metric strong{display:block;font-size:32px;color:var(--accent)}.meter{height:9px;background:#e3e1f2;border-radius:5px;overflow:hidden;margin:12px 0}.meter span{height:100%;display:block;background:var(--accent)}.branch{display:block;width:100%;text-align:left;margin:9px 0;padding:17px;border:1px solid #e1e3ee;background:#fff;border-radius:12px;cursor:pointer}.branch[aria-expanded=true]{border-color:var(--accent);background:#f4f1ff}.branch strong,.branch span{display:block}.branch span{font-size:13px;color:#68738a;margin-top:7px}.flash{background:var(--accent);border:0;border-radius:17px;min-height:230px;width:100%;color:white;font:inherit;font-size:24px;font-weight:750;padding:30px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.small{font-size:12px;color:#778198}button:focus-visible,input:focus-visible{outline:3px solid #9b8ff2;outline-offset:3px}@media(max-width:630px){body{padding:25px 17px}h1{font-size:30px}.panel{padding:19px}.choices{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><span class="eyebrow">SIMULAÇÃO · ENERGIA</span><h1>Estimativa de energia solar</h1><p>Avalie a geração ao variar potência e rendimento.</p></header><div id="app"></div></main><script>(function simRender(c){
const r=document.querySelector("#app");r.innerHTML=`<section class="panel"><span class="label">ALTERE OS VALORES</span>${c.inputs.map((x,i)=>`<div class="row"><div class="range-title"><label for="i${i}">${x[0]}</label><output id="v${i}"></output></div><input id="i${i}" type="range" min="${x[1]}" max="${x[2]}" value="${x[3]}" step="${x[4]}"></div>`).join("")}<div class="metric"><span>${c.resultLabel}</span><strong id="result" aria-live="polite"></strong><div class="meter"><span id="meter"></span></div><p id="formula"></p></div><p class="small">${c.caution}</p></section>`;
const nf=n=>new Intl.NumberFormat("pt-BR",{maximumFractionDigits:2}).format(n);
function calculate(a){switch(c.model){case"budget":return [a[0]-a[1],"Receitas menos despesas."];case"solar":return [a[0]*a[1]*a[2]/100000,"Potência × horas de sol × rendimento (%) ÷ 100.000."];case"water":return [a[0]*a[1]*a[2]/1000,"Pessoas × litros/dia × dias ÷ 1.000."];case"support":return [a[0]*a[1]/a[2]/60,"Chamados × minutos/chamado ÷ agentes ÷ 60."];case"study":return [a[0]*a[1]/60,"Minutos por sessão × sessões ÷ 60."];case"event":return [a[0]*(100-a[1])/100,"Vagas × taxa esperada de comparecimento."];return[0,""];}}
function change(){const values=c.inputs.map((x,i)=>+r.querySelector("#i"+i).value);c.inputs.forEach((x,i)=>r.querySelector("#v"+i).textContent=nf(values[i])+" "+x[5]);const [value,formula]=calculate(values);r.querySelector("#result").textContent=(c.prefix||"")+nf(value)+(c.suffix||"");r.querySelector("#formula").textContent=formula;r.querySelector("#meter").style.width=Math.max(0,Math.min(100,100*Math.abs(value)/c.scale))+"%";}
r.querySelectorAll("input").forEach(x=>x.addEventListener("input",change));change();
})({"title":"Estimativa de energia solar","subtitle":"Avalie a geração ao variar potência e rendimento.","kicker":"SIMULAÇÃO · ENERGIA","color":"#bc783b","bg":"#fff7ec","model":"solar","inputs":[["Potência instalada",500,10000,3200,100,"W"],["Horas de sol",2,8,5,0.5,"h"],["Rendimento",50,100,80,5,"%"]],"resultLabel":"Geração diária","prefix":"","suffix":" kWh","scale":50,"caution":"Clima, orientação e características do equipamento influenciam resultados reais."});</script></body></html>
