</style></head><body><main><header><span class="kicker">PÁGINA · Tutorial passo a passo</span><h1>Criando uma senha segura</h1><p>O estudante percorre as etapas de uma orientação prática.</p></header><div id="app"></div></main><script>(function pageRender(c){
 const root=document.querySelector("#app"),items=c.items;let index=0;const e=(s)=>{const x=document.createElement("div");x.textContent=s;return x.innerHTML;};
 function render(){
  if(c.mode==="faq"){root.innerHTML=items.map(i=>`<details><summary>${e(i.title)}</summary><p>${e(i.text)}</p></details>`).join("");return;}
  if(c.mode==="cards"){root.innerHTML=`<div class="grid">${items.map((i,n)=>`<button class="choice flip" data-n="${n}" aria-expanded="false"><strong>${e(i.title)}</strong><span>Toque para revelar a explicação</span></button>`).join("")}</div>`;root.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=items[+b.dataset.n];const opened=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!opened));b.querySelector("span").textContent=opened?"Toque para revelar a explicação":i.text;});return;}
  if(c.mode==="check"){root.innerHTML=`<section class="panel"><h2>Confira o que você já aprendeu</h2><p class="muted">Marque cada etapa conforme avança.</p>${items.map((i,n)=>`<label class="tick"><input type="checkbox" data-n="${n}"><span><b>${e(i.title)}</b><br>${e(i.text)}</span></label>`).join("")}<p id="status" class="small-label" role="status"></p><div class="progress"><span id="bar"></span></div></section>`;root.querySelectorAll("input").forEach(x=>x.onchange=()=>{const done=root.querySelectorAll("input:checked").length;root.querySelector("#status").textContent=`${done} de ${items.length} etapas concluídas nesta demonstração.`;root.querySelector("#bar").style.width=(done/items.length*100)+"%";});root.querySelector("input").dispatchEvent(new Event("change"));return;}
  if(c.mode==="tutorial"||c.mode==="tabs"||c.mode==="reading"){root.innerHTML=`<section class="panel"><div class="steps">${items.map((it,n)=>`<button data-n="${n}" aria-current="${n===index}">${c.mode==="tabs"?e(it.title):"Etapa "+(n+1)}</button>`).join("")}</div><div class="small-label">${index+1} / ${items.length}</div><div class="progress"><span style="width:${(index+1)/items.length*100}%"></span></div><h2>${e(items[index].title)}</h2><p>${e(items[index].text)}</p><div class="actions"><button class="btn secondary" id="prev" ${index===0?"disabled":""}>Anterior</button><button class="btn" id="next" ${index===items.length-1?"disabled":""}>Próximo</button></div></section>`;root.querySelectorAll(".steps button").forEach(b=>b.onclick=()=>{index=+b.dataset.n;render();});root.querySelector("#prev").onclick=()=>{index--;render();};root.querySelector("#next").onclick=()=>{index++;render();};return;}
  root.innerHTML=`<section class="panel"><h2>Explore o assunto por blocos</h2>${items.map((it,n)=>`<div class="item"><span class="chip">Bloco ${n+1}</span><h3>${e(it.title)}</h3><p>${e(it.text)}</p></div>`).join("")}</section>`;
 }render();
})({"slug":"criando-uma-senha-segura","title":"Criando uma senha segura","subtitle":"O estudante percorre as etapas de uma orientação prática.","description":"O estudante percorre as etapas de uma orientação prática.","how":"Abas ou etapas exibem um bloco por vez e permitem navegar no conteúdo.","features":["Tutorial passo a passo","Acessível"],"kicker":"PÁGINA · Tutorial passo a passo","mode":"tutorial","items":[["Comece pelo comprimento","Prefira uma frase longa com palavras não relacionadas ou use um gerenciador de senhas."],["Não reutilize","Use uma senha diferente para cada serviço, principalmente e-mail."],["Ative outro fator","Ative autenticação multifator quando disponível."],["Guarde com segurança","Um gerenciador de senhas permite guardar credenciais sem anotar em locais expostos."]],"color":"#127fa6","bg":"#eefaff"});</script></body></html>
