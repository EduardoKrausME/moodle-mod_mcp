<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Privacidade na inscrição</title><style>
:root{font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#26334e;background:#ecf9f6;--accent:#16857f}*{box-sizing:border-box}body{margin:0;padding:42px 35px}main{max-width:850px;margin:auto}.eyebrow{letter-spacing:1.5px;font-size:11px;font-weight:800;color:var(--accent)}h1{font-size:39px;line-height:1.15;letter-spacing:-1px;margin:7px 0 14px}h2{font-size:22px;margin:9px 0 16px}p{color:#65728b;margin:10px 0 17px}header p{max-width:650px;font-size:15px}.panel{margin-top:25px;padding:28px;background:#fff;border:1px solid #e1e3f0;border-radius:18px;box-shadow:0 10px 26px #28324c0c}.label{display:inline-block;color:var(--accent);font-size:11px;font-weight:800;background:#f4f1ff;border-radius:6px;padding:7px 10px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:19px 0}.choice{font:inherit;font-weight:660;text-align:left;border:1px solid #d9dcea;background:#fff;border-radius:12px;padding:17px;min-height:72px;cursor:pointer;color:#364361}.choice:hover,.choice[aria-pressed=true]{border-color:var(--accent);background:#f4f1ff}.btn{border:1px solid var(--accent);background:var(--accent);color:white;font:inherit;font-weight:750;font-size:13px;border-radius:10px;padding:12px 17px;cursor:pointer}.btn.light{color:var(--accent);background:#fff}.callout{background:#f2efff;border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:16px;margin:20px 0;color:#435273}.row{padding:15px 0;border-bottom:1px solid #eceef5}.range-title{display:flex;justify-content:space-between;gap:10px;color:#45526c;font-weight:700}.range-title output{color:var(--accent)}input[type=range]{display:block;width:100%;margin:15px 0;accent-color:var(--accent)}.metric{background:#f4f2ff;padding:22px;border-radius:13px;margin-top:22px}.metric strong{display:block;font-size:32px;color:var(--accent)}.meter{height:9px;background:#e3e1f2;border-radius:5px;overflow:hidden;margin:12px 0}.meter span{height:100%;display:block;background:var(--accent)}.branch{display:block;width:100%;text-align:left;margin:9px 0;padding:17px;border:1px solid #e1e3ee;background:#fff;border-radius:12px;cursor:pointer}.branch[aria-expanded=true]{border-color:var(--accent);background:#f4f1ff}.branch strong,.branch span{display:block}.branch span{font-size:13px;color:#68738a;margin-top:7px}.flash{background:var(--accent);border:0;border-radius:17px;min-height:230px;width:100%;color:white;font:inherit;font-size:24px;font-weight:750;padding:30px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.small{font-size:12px;color:#778198}button:focus-visible,input:focus-visible{outline:3px solid #9b8ff2;outline-offset:3px}@media(max-width:630px){body{padding:25px 17px}h1{font-size:30px}.panel{padding:19px}.choices{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main><header><span class="eyebrow">ESTUDO DE CASO · PRIVACIDADE</span><h1>Privacidade na inscrição</h1><p>Escolha ações, observe consequências e explore outros caminhos.</p></header><div id="app"></div></main><script>(function caseRender(c){
const root=document.querySelector("#app");let phase=0,first=-1;const esc=x=>{const n=document.createElement("div");n.textContent=x;return n.innerHTML;};
function render(){
if(phase===0){root.innerHTML=`<section class="panel"><span class="label">SITUAÇÃO</span><h2>${esc(c.situation)}</h2><p>${esc(c.context)}</p><div class="choices">${c.options.map((x,i)=>`<button class="choice" data-i="${i}">${esc(x[0])}</button>`).join("")}</div></section>`;root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{first=+b.dataset.i;phase=1;render();});}
else if(phase===1){root.innerHTML=`<section class="panel"><span class="label">CONSEQUÊNCIA DA PRIMEIRA ESCOLHA</span><h2>${esc(c.options[first][2])}</h2><div class="callout">${esc(c.options[first][1])}</div><h2>Qual será o próximo passo?</h2><div class="choices">${c.follow.map((x,i)=>`<button class="choice" data-i="${i}">${esc(x[0])}</button>`).join("")}</div></section>`;root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{phase=2;const x=c.follow[+b.dataset.i];root.innerHTML=`<section class="panel"><span class="label">DESFECHO</span><h2>${esc(x[2])}</h2><div class="callout">${esc(x[1])}</div><p><strong>Para refletir:</strong> ${esc(c.lesson)}</p><p class="small">Decisões didáticas simuladas, sem registro de nota no Moodle.</p><button id="again" class="btn">Explorar outro caminho</button></section>`;root.querySelector("#again").onclick=()=>{phase=0;first=-1;render();};});}
}render();
})({"title":"Privacidade na inscrição","subtitle":"Escolha ações, observe consequências e explore outros caminhos.","kicker":"ESTUDO DE CASO · PRIVACIDADE","color":"#16857f","bg":"#ecf9f6","situation":"Uma equipe deseja inserir muitos campos pessoais num formulário.","context":"Vários campos não parecem necessários à finalidade declarada.","options":[["Revisar a necessidade de cada dado","A equipe identifica quais campos realmente são necessários.","Coleta proporcional"],["Solicitar tudo por precaução","Dados desnecessários aumentam exposição e trabalho de manutenção.","Coleta excessiva"]],"follow":[["Explicar finalidade e acesso","O formulário passa a ser mais transparente.","Clareza para o participante"],["Ocultar a finalidade","O participante fica sem contexto para compreender a solicitação.","Baixa transparência"]],"lesson":"A coleta deve ser proporcional ao objetivo e comunicada com clareza."});</script></body></html>
