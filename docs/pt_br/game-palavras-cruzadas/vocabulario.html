:root{font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#263452;background:#fff6ed;--accent:#bb6b38}*{box-sizing:border-box}body{margin:0;padding:39px 36px 52px}main{max-width:875px;margin:auto}.eyebrow{font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:820;letter-spacing:1.8px}h1{font-size:38px;line-height:1.12;margin:9px 0 13px;letter-spacing:-1px}h2{font-size:21px}header p{color:#67748d;max-width:650px;font-size:15px}.panel{background:white;border:1px solid #e0e4f1;border-radius:18px;padding:27px;margin-top:26px;box-shadow:0 10px 30px #2d39610a}.small{color:#78839a;font-size:13px}.btn{font:inherit;font-size:14px;font-weight:730;background:var(--accent);border:1px solid var(--accent);color:white;border-radius:10px;padding:11px 15px;cursor:pointer}.btn.alt{color:var(--accent);background:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.status{margin:17px 0 0;color:#52617c;font-weight:660;min-height:20px}.status.good{color:#1b8565}.status.warn{color:#a56326}.grid{display:grid;gap:12px}.twocol{grid-template-columns:repeat(2,minmax(0,1fr))}.threecol{grid-template-columns:repeat(3,minmax(0,1fr))}.card-btn{background:#fff;border:1px solid #dce1ee;border-radius:12px;min-height:70px;padding:16px;font:inherit;font-size:16px;font-weight:740;color:#384765;cursor:pointer}.card-btn:hover,.card-btn.selected{border-color:var(--accent);background:#f0effe}.card-btn.matched{background:#e6f7ef;border-color:#85c8ac;color:#26795b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.smallbtn{border:1px solid #dbe0eb;background:white;border-radius:7px;color:var(--accent);padding:6px 11px;font:inherit;cursor:pointer}.game-grid{display:grid;gap:5px;width:max-content;max-width:100%}.word-grid{grid-template-columns:repeat(8,40px)}.letter{border:1px solid #d7ddeb;width:40px;height:40px;border-radius:7px;background:#fff;font:inherit;font-weight:780;color:#384662;cursor:pointer}.letter.selected{background:#e4dfff;border-color:var(-- dden}.scene svg{width:100%;height:auto;display:block}.hotspot{position:absolute;background:transparent;border:2px solid transparent;border-radius:50%;width:19%;height:24%;transform:translate(-50%,-50%);cursor:pointer}.hotspot.found{border-color:#2fa87f;background:#21a57b33}.bingo{display:grid;grid-template-columns:repeat(4,64px);gap:5px}.bingo button{border:1px solid #dce0ed;border-radius:9px;width:64px;height:64px;background:#fff;color:#3e4a65;font:inherit;font-size:21px;font-weight:800;cursor:pointer}.bingo button.marked{background:#d8f4e9;border-color:#58ba93;color:#1e7a59}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9d8df0;outline-offset:2px}@media(max-width:650px){body{padding:24px 16px}.panel{padding:18px}h1{font-size:29px}.twocol,.scene-grid{grid-template-columns:1fr}.word-grid{grid-template-columns:repeat(8,31px)}.letter{width:31px;height:31px}.tiles{grid-template-columns:repeat(3,72px)}.tile{width:72px;height:72px}.crossword{grid-template-columns:repeat(5,39px)}.crossword input{width:39px;height:39px}.bingo{grid-template-columns:repeat(4,52px)}.bingo button{width:52px;height:52px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Crossword: 26 palavras, pistas numeradas e navegação acessível também no celular. */
.crossword-page main{max-width:1120px}
.crossword-page .crossword-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
.crossword-page .crossword-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding:3px 3px 12px}
.crossword-page .crossword{width:max-content;max-width:none;display:grid;grid-template-columns:repeat(var(--cw-cols),var(--cw-cell));gap:2px;background:#26324f;border-radius:9px;padding:5px}
.crossword-page .cw-square{position:relative;width:var(--cw-cell);height:var(--cw-cell);background:#fff;border-radius:3px}
.crossword-page .cw-square.empty{background:#26324f}

.crossword-page .cw-square .cw-number{position:absolute;top:1px;left:3px;color:#54617b;font-size:10px;font-weight:750;line-height:1;pointer-events:none}
.crossword-page .cw-square.active-word{background:#fff3d9}
.crossword-page .cw-square.active-word:focus-within{background:#ffdfa1}
.crossword-page .cw-square.correct-word{background:#e1f6e9}
.crossword-page .cw-square input:focus-visible{outline:2px solid #bb6b38;outline-offset:-2px}

.crossword-page .cw-clues h3{font-size:16px;color:#3b4b69;margin:0 0 12px}
.crossword-page .cw-clues ol{padding:0;list-style:none;display:grid;gap:5px;margin:0}
.crossword-page .cw-clues li{margin:0}
.crossword-page .cw-clue{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;color:#374862;font:inherit;font-size:14px;line-height:1.45;padding:8px;cursor:pointer}
.crossword-page .cw-clue:hover,.crossword-page .cw-clue.selected{background:#fff0df;border-color:#e7bd99}

</style></head><body class="crossword-page"><main><header><span class="eyebrow">GAME EDUCATIVO · Palavras cruzadas</span><h1>Palavras cruzadas</h1><p>Resolva 26 palavras interligadas com pistas sobre natureza e cotidiano.</p></header><div id="game"></div></main><script>(function gameEngine(c){

const panel=markup=>{root.innerHTML=`<section class="panel">${markup}<p id="game-status" class="status" role="status" aria-live="polite"></p></section>`;};
const status=(text,good=false)=>{const p=root.querySelector("#game-status");if(p){p.textContent=text;p.className="status "+(good?"good":"warn");}};
const shuffle=a=>{const v=[...a];for(let i=v.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]];}return v;};
function memory(){
 const cards=shuffle(c.pairs.flatMap((p,n)=>[{id:n,text:p[0]},{id:n,text:p[1]}]));let shown=[],solved=new Set(),busy=false;
 panel(`<h2>Encontre os pares</h2><p class="small">Revele duas cartas de cada vez e combine o conceito com a definição.</p><div class="grid threecol" id="pairs">${cards.map((_,i)=>`<button class="card-btn" data-i="${i}" aria-label="Virar carta ${i+1}">?</button>`).join("")}</div><div class="actions"><button class="btn alt" id="reset">Reembaralhar</button></div>`);
 root.querySelector("#reset").onclick=memory;root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
 const i=+b.dataset.i;if(busy||shown.includes(i)||solved.has(i))return;shown.push(i);b.textContent=cards[i].text;b.classList.add("selected");if(shown.length!==2)return;busy=true;const [a,z]=shown;
 if(cards[a].id===cards[z].id){solved.add(a);solved.add(z);for(const k of shown){const x=root.querySelector(`[data-i="${k}"]`);x.classList.add("matched");x.classList.remove("selected");}shown=[];busy=false;status(solved.size===cards.length?"Parabéns! Todos os pares encontrados.":`${solved.size/2} par(es) encontrados.`,true);}
 else setTimeout(()=>{for(const k of shown){const x=root.querySelector(`[data-i="${k}"]`);if(x){x.textContent="?";x.classList.remove("selected");}}shown=[];busy=false;status("Tente outra combinação.");},750);
 });}
function search(){
 const rows=["SOLQWERT","HJKMARPL","LUABCDXY","QWERASDF","ZXCVBNML","RTPASIOD","NBECDTRU","WQAPTRES"],words=["SOL","MAR","LUA"];let from=null,found=new Set(),hits=new Set();
 panel(`<h2>Localize SOL, MAR e LUA</h2><p class="small">Clique na primeira e na última letra de uma palavra horizontal ou vertical.</p><div class="game-grid word-grid">${rows.join("").split("").map((v,i)=>`<button class="letter" data-i="${i}" aria-label="Linha ${Math.floor(i/8)+1}, coluna ${i%8+1}, letra ${v}">${v}</button>`).join("")}</div><p id="found-list" class="small"></p>`);
 root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const end=+b.dataset.i;if(from===null){from=end;b.classList.add("selected");return;}const r0=Math.floor(from/8),c0=from%8,r1=Math.floor(end/8),c1=end%8;const dirR=Math.sign(r1-r0),dirC=Math.sign(c1-c0);let indices=[];if(r0===r1||c0===c1){const steps=Math.max(Math.abs(r1-r0),Math.abs(c1-c0));for(let j=0;j<=steps;j++)indices.push((r0+j*dirR)*8+c0+j*dirC);}const word=indices.map(k=>rows[Math.floor(k/8)][k%8]).join("");const target=words.find(w=>w===word||w===word.split("").reverse().join(""));root.querySelectorAll(".letter.selected").forEach(x=>x.classList.remove("selected"));from=null;if(target){found.add(target);indices.forEach(k=>hits.add(k));root.querySelectorAll(".letter").forEach(x=>x.classList.toggle("found",hits.has(+x.dataset.i)));root.querySelector("#found-list").textContent="Encontradas: "+[...found].join(", ");status(found.size===words.length?"Você encontrou todas as palavras!":"Boa! Continue procurando.",true);}else status("Selecione uma sequência que forme uma das palavras.");});
}
function puzzle(){
 let tiles=[1,2,3,4,5,6,7,8,0],moves=0;for(let k=0;k<42;k++){const at=tiles.indexOf(0),r=Math.floor(at/3),col=at%3,choices=[r>0?at-3:-1,r<2?at+3:-1,col>0?at-1:-1,col<2?at+1:-1].filter(x=>x>=0);const next=choices[Math.floor(Math.random()*choices.length)];[tiles[at],tiles[next]]=[tiles[next],tiles[at]];}
 function draw(){panel(`<h2>Ordene as peças de 1 a 8</h2><p class="small">Mova uma peça adjacente ao espaço vazio para reorganizar o tabuleiro.</p><div class="game-grid tiles">${tiles.map((v,i)=>`<button class="tile ${v===0?"empty":""}" data-i="${i}" ${v===0?'aria-label="Espaço vazio"':""}>${v||""}</button>`).join("")}</div><p class="small">Movimentos: ${moves}</p><button id="reset" class="btn alt">Misturar novamente</button>`);root.querySelector("#reset").onclick=puzzle;root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,z=tiles.indexOf(0);if(Math.abs(Math.floor(i/3)-Math.floor(z/3))+Math.abs(i%3-z%3)!==1)return;[tiles[i],tiles[z]]=[tiles[z],tiles[i]];moves++;draw();if(tiles.every((x,k)=>x===(k+1)%9))status("Puzzle resolvido em "+moves+" movimentos!",true);});}draw();
}
function drag(){
 const terms=[["HTML","Web"],["CSS","Web"],["JavaScript","Web"],["Sol","Natureza"],["Rio","Natureza"],["Árvore","Natureza"]];let selected=null,placed=new Set();
 panel(`<h2>Arraste cada item para sua categoria</h2><p class="small">Você também pode selecionar um item e depois clicar na categoria, inclusive usando o teclado.</p><div id="terms" class="terms">${terms.map((t,i)=>`<button class="term" draggable="true" data-term="${i}">${escape(t[0])}</button>`).join("")}</div><div class="grid twocol" style="margin-top:20px">${["Web","Natureza"].map(cat=>`<div class="bucket" data-target="${cat}" role="button" tabindex="0" aria-label="Categoria ${cat}"><h3>${cat}</h3><div class="terms"></div></div>`).join("")}</div>`);
 function assign(category){if(selected===null||placed.has(selected))return;const item=terms[selected],id=selected;if(item[1]!==category){status("Esse termo pertence à outra categoria.");return;}const zone=[...root.querySelectorAll("[data-target]")].find(n=>n.dataset.target===category);zone.querySelector(".terms").appendChild(root.querySelector(`[data-term="${id}"]`));root.querySelector(`[data-term="${id}"]`).classList.add("placed");placed.add(id);selected=null;status(placed.size===terms.length?"Todos os itens foram classificados!":`${placed.size} de ${terms.length} itens classificados.`,true);}
 root.querySelectorAll("[data-term]").forEach(b=>{b.onclick=()=>{if(placed.has(+b.dataset.term))return;root.querySelectorAll(".term").forEach(x=>x.classList.remove("selected"));selected=+b.dataset.term;b.classList.add("selected");};b.addEventListener("dragstart",e=>{if(placed.has(+b.dataset.term)){e.preventDefault();return;}selected=+b.dataset.term;e.dataTransfer.setData("text/plain",String(selected));});});
 root.querySelectorAll("[data-target]").forEach(z=>{z.onclick=()=>assign(z.dataset.target);z.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();assign(z.dataset.target);}};z.addEventListener("dragover",e=>e.preventDefault());z.addEventListener("drop",e=>{e.preventDefault();const value=e.dataTransfer.getData("text/plain");if(/^\d+$/.test(value))selected=+value;assign(z.dataset.target);});});
}
function crossword(){
 const rows=22,cols=17;
 const entries=[{"answer":"CHUVA","row":0,"col":5,"direction":"H","clue":"Precipitação de gotas de água das nuvens."},{"answer":"CIDADE","row":0,"col":5,"direction":"V","clue":"Área urbana com ruas, bairros e serviços."},{"answer":"LAGO","row":2,"col":13,"direction":"H","clue":"Massa de água cercada por terra."},{"answer":"ARVORE","row":3,"col":5,"direction":"H","clue":"Planta de tronco lenhoso e copa."},{"answer":"ESTRELA","row":3,"col":10,"direction":"V","clue":"Astro que produz sua própria luz, como o Sol."},{"answer":"ANIMAL","row":2,"col":14,"direction":"V","clue":"Ser vivo que se alimenta de outros organismos."},{"answer":"FLORESTA","row":6,"col":7,"direction":"H","clue":"Área com grande concentração de árvores."},{"answer":"TERRA","row":8,"col":12,"direction":"V","clue":"Planeta em que vivemos."},{"answer":"VENTO","row":9,"col":8,"direction":"V","clue":"Ar em movimento."},{"answer":"AREIA","row":9,"col":10,"direction":"H","clue":"Grãos que formam grande parte das praias."},{"answer":"AGUA","row":9,"col":14,"direction":"V","clue":"Substância essencial à vida, encontrada em rios e mares."},{"answer":"NUVEM","row":10,"col":5,"direction":"H","clue":"Conjunto visível de gotículas ou cristais na atmosfera."},{"answer":"MONTANHA","row":12,"col":5,"direction":"H","clue":"Grande elevação natural do relevo."},{"answer":"OCEANO","row":12,"col":6,"direction":"V","clue":"Imensa extensão de água salgada."},{"answer":"JARDIM","row":13,"col":3,"direction":"V","clue":"Espaço com plantas cultivadas para lazer ou ornamentação."},{"answer":"DIA","row":13,"col":13,"direction":"V","clue":"Período iluminado pelo Sol, em oposição à noite."},{"answer":"PLANTA","row":15,"col":8,"direction":"H","clue":"Ser vivo que geralmente faz fotossíntese."},{"answer":"NOITE","row":15,"col":11,"direction":"V","clue":"Período em que o Sol está abaixo do horizonte local."},{"answer":"ENERGIA","row":15,"col":0,"direction":"H","clue":"Capacidade de produzir trabalho ou provocar transformações."},{"answer":"SOL","row":17,"col":5,"direction":"H","clue":"Estrela central do Sistema Solar."},{"answer":"RIO","row":17,"col":10,"direction":"H","clue":"Curso natural de água que flui por um leito."},{"answer":"LUA","row":17,"col":7,"direction":"V","clue":"Satélite natural da Terra."},{"answer":"MAR","row":18,"col":13,"direction":"V","clue":"Porção do oceano próxima ou parcialmente cercada por terra."},{"answer":"NATUREZA","row":19,"col":6,"direction":"H","clue":"Conjunto dos seres vivos e dos elementos do mundo físico."},{"answer":"RUA","row":19,"col":10,"direction":"V","clue":"Via urbana usada por pedestres e veículos."},{"answer":"PRAIA","row":21,"col":6,"direction":"H","clue":"Faixa de areia ou pedras junto a um corpo de água."}];
 const correct=new Map(),starts=new Map(),words=[];
 const entryStarts=new Map();
 entries.forEach((entry,id)=>{
  const keys=[...entry.answer].map((letter,i)=>{
   const row=entry.row+(entry.direction==="V"?i:0),col=entry.col+(entry.direction==="H"?i:0),key=row+"-"+col;

  });

 });
 const ordered=words.slice().sort((a,b)=>a.row-b.row||a.col-b.col);
 let nextNumber=0;
 ordered.forEach(word=>{
  const key=entryStarts.get(word.id);
  if(!starts.has(key))starts.set(key,++nextNumber);

 });
 const alphabetLabel=word=>word.number+" "+(word.direction==="horizontal"?"horizontal":"vertical");
 const hints=direction=>words.filter(w=>w.direction===direction).sort((a,b)=>a.number-b.number).map(word=>
   '<li><button type="button" class="cw-clue" data-word="'+word.id+'">'+word.number+'. '+escape(word.clue)+' ('+word.answer.length+')</button></li>'
 ).join("");
 panel('<h2>26 palavras para descobrir</h2>'+
  '<p class="small">Complete as palavras a partir das pistas. Clique em uma pista para começar, digite uma letra para avançar automaticamente e substitua qualquer letra digitando outra. Nos cruzamentos, use as setas para mudar de direção. As respostas são escritas sem acentos.</p>'+
  '<p id="cw-counter" aria-live="polite">0 de '+words.length+' palavras corretas.</p>'+

   const number=starts.get(key);
   return '<span class="cw-square" data-cell="'+key+'">'+(number?'<span class="cw-number" aria-hidden="true">'+number+'</span>':"")+
    '<input data-key="'+key+'" maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Linha '+(row+1)+', coluna '+(col+1)+(number?", início "+number:"")+'"></span>';
  }).join("")+'</div></div>'+
  '<div class="cw-clues"><section aria-label="Pistas horizontais"><h3>Horizontais</h3><ol>'+hints("horizontal")+'</ol></section>'+

 const inputs=[...root.querySelectorAll("#cw-grid input")],byKey=new Map(inputs.map(input=>[input.dataset.key,input]));
 const byId=new Map(words.map(word=>[word.id,word]));
 let activeWord=null;

 function highlight(){
  root.querySelectorAll(".cw-square.active-word").forEach(square=>square.classList.remove("active-word"));

  }

 function selectWord(input,prefer){
  const choices=candidates(input.dataset.key);
  if(prefer){activeWord=choices.find(word=>word.id===prefer.id)||choices[0];}
  else if(!activeWord||!activeWord.keys.includes(input.dataset.key)){

 function focusCell(input){if(input){input.focus({preventScroll:true});input.select();input.scrollIntoView({block:"nearest",inline:"nearest"});}}
 function enterLetter(input,value){
  const letter=[...value.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleUpperCase("pt-BR")].findLast(ch=>/^[A-Z]$/.test(ch));
  if(!letter)return;
  selectWord(input);
  input.value=letter;
  clearCorrectHighlight();
  const next=byKey.get(activeWord.keys[activeWord.keys.indexOf(input.dataset.key)+1]);
  if(next)focusCell(next);else input.select();
 }
 function clearCorrectHighlight(){
  root.querySelectorAll(".cw-square.correct-word").forEach(square=>square.classList.remove("correct-word"));
  root.querySelectorAll(".cw-clue.correct").forEach(button=>button.classList.remove("correct"));
 }
 inputs.forEach(input=>{
  input.addEventListener("focus",()=>{selectWord(input);input.select();});
  input.addEventListener("click",()=>{
   const choices=candidates(input.dataset.key);
   if(choices.length>1&&activeWord&&choices.some(w=>w.id===activeWord.id)){
    activeWord=choices.find(w=>w.id!==activeWord.id)||activeWord;highlight();
   }
   input.select();
  });
  input.addEventListener("keydown",event=>{
   if(event.key.startsWith("Arrow")){
    const steps={ArrowRight:[0,1,"horizontal"],ArrowLeft:[0,-1,"horizontal"],ArrowDown:[1,0,"vertical"],ArrowUp:[-1,0,"vertical"]};
    const step=steps[event.key];
    if(!step)return;
    const [r,c]=input.dataset.key.split("-").map(Number);
    const target=byKey.get((r+step[0])+"-"+(c+step[1]));
    if(target){
     event.preventDefault();
     const word=words.find(w=>w.direction===step[2]&&w.keys.includes(input.dataset.key)&&w.keys.includes(target.dataset.key));
     if(word)activeWord=word;
     focusCell(target);
    }
   }else if(event.key==="Backspace"){
    event.preventDefault();selectWord(input);clearCorrectHighlight();
    if(input.value){input.value="";return;}
    const prev=byKey.get(activeWord.keys[activeWord.keys.indexOf(input.dataset.key)-1]);
    if(prev){prev.value="";focusCell(prev);}
   }else if(event.key==="Delete"){
    event.preventDefault();input.value="";clearCorrectHighlight();
   }else if(!event.ctrlKey&&!event.metaKey&&!event.altKey&&!event.isComposing&&/^[a-zA-ZÀ-ÿ]$/.test(event.key)){
    event.preventDefault();enterLetter(input,event.key);
   }
  });
  input.addEventListener("beforeinput",event=>{
   if(!event.isComposing&&event.data&&(event.inputType==="insertText"||event.inputType==="insertReplacementText")){
    event.preventDefault();enterLetter(input,event.data);
   }
  });
  input.addEventListener("input",event=>{
   if(!event.isComposing&&input.value)enterLetter(input,input.value);
  });
  input.addEventListener("compositionend",()=>{if(input.value)enterLetter(input,input.value);});
 });
 root.querySelectorAll("[data-word]").forEach(button=>button.addEventListener("click",()=>{
  const word=byId.get(Number(button.dataset.word));if(!word)return;
  activeWord=word;highlight();
  const first=word.keys.map(key=>byKey.get(key)).find(input=>!input.value)||byKey.get(word.keys[0]);
  focusCell(first);
 }));
 root.querySelector("#check").onclick=()=>{
  clearCorrectHighlight();
  let count=0;
  for(const word of words){
   if(word.keys.every((key,i)=>byKey.get(key).value.toUpperCase()===word.answer[i])){
    count++;
    root.querySelector('[data-word="'+word.id+'"]')?.classList.add("correct");
    for(const key of word.keys)byKey.get(key).closest(".cw-square").classList.add("correct-word");
   }
  }
  root.querySelector("#cw-counter").textContent=count+" de "+words.length+" palavras corretas.";
  status(count===words.length?"Parabéns! Você completou as 26 palavras cruzadas!":count+" de "+words.length+" palavras corretas. Revise as demais.",count===words.length);
 };
 root.querySelector("#clean").onclick=()=>{
  inputs.forEach(input=>input.value="");
  clearCorrectHighlight();
  root.querySelector("#cw-counter").textContent="0 de "+words.length+" palavras corretas.";
  status("Respostas apagadas. Você pode começar novamente.");
  if(activeWord)focusCell(byKey.get(activeWord.keys[0]));
 };
}
function anagram(){
 const rounds=[["SOURC","CURSO","Ambiente de aprendizagem organizado em módulos."],["VORIL","LIVRO","Recurso composto por capítulos."],["LUAA","AULA","Encontro de ensino e aprendizagem."]];let round=0,selected=[];
 function draw(){if(round>=rounds.length){panel(`<h2>Todos os desafios resolvidos!</h2><button id="again" class="btn">Jogar novamente</button>`);root.querySelector("#again").onclick=anagram;return;}const [scramble,answer,hint]=rounds[round];panel(`<h2>Monte a palavra correta</h2><p class="small">${escape(hint)}</p><div class="kbd" id="letters">${[...scramble].map((l,n)=>`<button data-i="${n}" ${selected.includes(n)?"disabled":""}>${l}</button>`).join("")}</div><h2 id="assembled">${selected.map(k=>scramble[k]).join("")||"_"}</h2><div class="actions"><button class="btn" id="check">Conferir</button><button class="btn alt" id="clear">Limpar</button></div>`);root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{selected.push(+b.dataset.i);draw();});root.querySelector("#clear").onclick=()=>{selected=[];draw();};root.querySelector("#check").onclick=()=>{if(selected.map(k=>scramble[k]).join("")===answer){status("Correto! Próxima palavra.",true);setTimeout(()=>{round++;selected=[];draw();},500);}else status("A ordem ainda não está correta.");};}draw();
}
function order(){
 const solution=["Identificar o problema","Propor alternativas","Testar a solução","Registrar o resultado"];let current=[solution[2],solution[0],solution[3],solution[1]];
 function draw(){panel(`<h2>Organize o processo de solução</h2><p class="small">Use as setas para colocar as etapas em uma ordem lógica.</p><div class="ordered">${current.map((x,i)=>`<div class="ordered-row"><b>${i+1}</b><span>${escape(x)}</span><button class="smallbtn" data-i="${i}" data-m="-1" aria-label="Mover para cima" ${i===0?"disabled":""}>↑</button><button class="smallbtn" data-i="${i}" data-m="1" aria-label="Mover para baixo" ${i===3?"disabled":""}>↓</button></div>`).join("")}</div><div class="actions"><button class="btn" id="check">Conferir ordem</button></div>`);root.querySelectorAll("[data-i]:not(:disabled)").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=i+(+b.dataset.m);[current[i],current[j]]=[current[j],current[i]];draw();});root.querySelector("#check").onclick=()=>status(current.every((x,i)=>x===solution[i])?"Sequência correta!":"A sequência ainda pode melhorar.",current.every((x,i)=>x===solution[i]));}draw();
}
function hangman(){
 const answer="PLANETA",letters=new Set();let errors=0;
 function draw(){const won=[...answer].every(x=>letters.has(x)),lost=errors>=6;panel(`<h2>Descubra a palavra</h2><p class="small">Dica: corpo celeste que orbita uma estrela.</p><svg width="140" height="130" viewBox="0 0 140 130" aria-label="${errors} de 6 erros" role="img"><g stroke="#374769" fill="none" stroke-width="4" stroke-linecap="round"><path d="M12 124H100M30 124V10H90V27"/>${errors>=1?'<circle cx="90" cy="40" r="13"/>':""}${errors>=2?'<path d="M90 53V86"/>':""}${errors>=3?'<path d="M90 63L70 77"/>':""}${errors>=4?'<path d="M90 63L110 77"/>':""}${errors>=5?'<path d="M90 86L72 111"/>':""}${errors>=6?'<path d="M90 86L108 111"/>':""}</g></svg><div class="blank" aria-label="Palavra parcialmente revelada">${[...answer].map(x=>letters.has(x)?x:"_").join(" ")}</div><p class="small">Tentativas erradas: ${errors}/6</p><div class="kbd">${[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(l=>`<button data-letter="${l}" ${letters.has(l)||won||lost?"disabled":""}>${l}</button>`).join("")}</div><div class="actions"><button id="restart" class="btn alt">Recomeçar</button></div>`);root.querySelector("#restart").onclick=hangman;root.querySelectorAll("[data-letter]").forEach(b=>b.onclick=()=>{const letter=b.dataset.letter;letters.add(letter);if(!answer.includes(letter))errors++;draw();});if(won)status("Parabéns! Você descobriu PLANETA.",true);else if(lost)status("Fim das tentativas. A palavra era PLANETA.");}draw();
}
function iconmatch(){
 const pairs=[["☀️","Sol"],["💧","Água"],["🌱","Planta"],["📚","Livros"]],options=["Escolha","Planta","Sol","Livros","Água"];
 panel(`<h2>Associe símbolo e significado</h2><p class="small">Escolha um conceito para cada símbolo.</p>${pairs.map((p,i)=>`<div class="pair-row"><b>${p[0]}</b><label for="p${i}" class="small">Conceito ${i+1}</label><select id="p${i}">${options.map(x=>`<option value="${x==="Escolha"?"":x}">${x}</option>`).join("")}</select></div>`).join("")}<button id="check" class="btn">Verificar associações</button>`);
 root.querySelector("#check").onclick=()=>{const count=pairs.filter((p,i)=>root.querySelector("#p"+i).value===p[1]).length;status(count===pairs.length?"Associações completas!":`${count} de ${pairs.length} associações corretas.`,count===pairs.length);};
}
function quick(){
 const qs=[["Quanto é 6 × 6?",["36","30","42"],0],["Qual destas é uma linguagem de marcação?",["CSS","HTML","SQL"],1],["Quantos lados tem um hexágono?",["5","7","6"],2],["Quanto é 100 ÷ 4?",["20","25","40"],1]];let index=0,score=0,seconds=30,clock=null;
 function finish(){if(clock)clearInterval(clock);panel(`<h2>Tempo encerrado!</h2><p>Você acertou ${score} de ${qs.length} perguntas.</p><button id="again" class="btn">Jogar novamente</button>`);root.querySelector("#again").onclick=quick;}
 function show(){if(index>=qs.length){finish();return;}const q=qs[index];panel(`<h2>${escape(q[0])}</h2><p class="small">Pergunta ${index+1}/${qs.length} · <span id="time">${seconds}</span> segundos restantes</p><div class="grid twocol">${q[1].map((x,i)=>`<button class="card-btn" data-i="${i}">${escape(x)}</button>`).join("")}</div>`);root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(+b.dataset.i===q[2])score++;index++;show();});}
 panel(`<h2>Desafio relâmpago</h2><p>Responda quatro perguntas em até 30 segundos. O cronômetro só inicia quando você clicar.</p><button id="start" class="btn">Começar</button>`);root.querySelector("#start").onclick=()=>{clock=setInterval(()=>{seconds--;const t=root.querySelector("#time");if(t)t.textContent=seconds;if(seconds<=0)finish();},1000);show();};
}
function differences(){
 function scene(mod){return `<svg viewBox="0 0 300 190" role="img" aria-label="Paisagem com árvore, sol e nuvens"><rect width="300" height="190" fill="#c9e9fd"/><rect y="133" width="300" height="57" fill="#b0dba0"/><circle cx="${mod?79:59}" cy="42" r="21" fill="${mod?"#f4a35c":"#f8d65a"}"/><g fill="${mod?"#f3cad7":"#fff"}"><ellipse cx="200" cy="39" rx="34" ry="13"/><ellipse cx="219" cy="29" rx="22" ry="14"/></g><path d="M145 145V81" stroke="#886649" stroke-width="11"/><circle cx="145" cy="78" r="38" fill="#5cae68"/><circle cx="129" cy="84" r="6" fill="#eb5e4b"/><circle cx="159" cy="70" r="6" fill="#eb5e4b"/>${mod?'<circle cx="162" cy="95" r="6" fill="#eb5e4b"/>':""}<path d="M15 150Q38 136 58 150" fill="none" stroke="#639e64" stroke-width="4"/></svg>`;}
 const points=[{x:26,y:23,label:"Sol"},{x:70,y:22,label:"Nuvem"},{x:53,y:50,label:"Fruto na árvore"}];let found=new Set();
 panel(`<h2>Encontre três diferenças</h2><p class="small">Compare as duas paisagens e clique nas áreas diferentes da imagem da direita.</p><div class="scene-grid"><div class="scene">${scene(false)}</div><div class="scene">${scene(true)}${points.map((p,i)=>`<button class="hotspot" data-i="${i}" style="left:${p.x}%;top:${p.y}%" aria-label="Marcar diferença: ${p.label}"></button>`).join("")}</div></div><p class="small" id="counter">0 de 3 diferenças encontradas</p>`);
 root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{found.add(+b.dataset.i);b.classList.add("found");root.querySelector("#counter").textContent=found.size+" de 3 diferenças encontradas";status(found.size===3?"Você encontrou todas as diferenças!":"Boa observação!",true);});
}
function bingo(){
 let numbers=shuffle(Array.from({length:16},(_,i)=>i+1)),drawn=new Set(),marked=new Set();
 function hasBingo(){const lines=[];for(let r=0;r<4;r++)lines.push([0,1,2,3].map(k=>r*4+k));for(let q=0;q<4;q++)lines.push([0,1,2,3].map(k=>k*4+q));lines.push([0,5,10,15],[3,6,9,12]);return lines.some(line=>line.every(k=>marked.has(k)));}
 function draw(){panel(`<h2>Bingo de números</h2><p class="small">Sorteie um número e marque-o no tabuleiro. Complete uma linha, coluna ou diagonal.</p><div class="bingo">${numbers.map((n,i)=>`<button data-i="${i}" class="${marked.has(i)?"marked":""}" aria-pressed="${marked.has(i)}">${n}</button>`).join("")}</div><div class="actions"><button id="draw" class="btn" ${drawn.size===16?"disabled":""}>Sortear número</button><button id="reset" class="btn alt">Novo jogo</button></div><p id="called" class="small">Sorteados: ${[...drawn].join(", ")||"nenhum"}</p>`);root.querySelector("#reset").onclick=bingo;root.querySelector("#draw").onclick=()=>{const left=numbers.filter(x=>!drawn.has(x));const val=left[Math.floor(Math.random()*left.length)];drawn.add(val);draw();status("Número sorteado: "+val);};root.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,n=numbers[i];if(!drawn.has(n)){status("Esse número ainda não foi sorteado.");return;}marked.has(i)?marked.delete(i):marked.add(i);draw();if(hasBingo())status("BINGO! Você completou uma linha, coluna ou diagonal.",true);else status("Número "+n+" marcado.",true);});}draw();
}
